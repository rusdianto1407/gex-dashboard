[tool.poetry]
name = "gex-dashboard-backend"
version = "0.1.0"
description = "GEX (Gamma Exposure) dashboard backend - SPX with ES-futures basis projection"
authors = ["rusdianto1407 <rusdianto14@proton.me>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.136.1"}
databento = "^0.66.0"
numpy = "^2.1.0"
scipy = "^1.14.0"
pandas = "^2.2.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
python-dateutil = "^2.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"
mypy = "^1.13.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
